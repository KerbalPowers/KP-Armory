PART
{
	// --- general parameters ---
	name = kpaWyrm
	module = Part
	author = MiffedStarfish / Spartwo

	// --- asset parameters ---
	mesh = wyrm.mu
	rescaleFactor = 1

	// --- node definitions ---
	node_attach = 0.0, -0.0, 0, 0, -1, 0, 1
	node_stack_bottom = 0.0, -0.0, 0, 0, -1, 0, 1

	// --- editor parameters ---
	TechRequired = precisionEngineering
	entryCost = 25000
	cost = 10000
	category = none
	bdacategory = Laser turrets
	subcategory = 0
	
	
	attachRules = 1,1,1,1,1 // attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	bulkheadProfiles = size1, srf
	
	title = #LOC_KPDynamics_Wyrm_title
	manufacturer = #LOC_KPDynamics_Gladia_title
	description = #LOC_KPDynamics_Wyrm_description
	tags = #loc_BDArmory_part_bahaABL_tags


	// --- standard part parameters ---
	mass = 0.8
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 60
	maxTemp = 3600

	stagingIcon = SOLID_BOOSTER


	MODULE
	{
		name = ModuleTurret

		pitchTransformName = PitchTransform
		yawTransformName = YawTransform

		pitchSpeedDPS = 220
		yawSpeedDPS = 220

		maxPitch = 90
		minPitch = -15

		yawRange = 360

		smoothRotation = true
		smoothMultiplier = 20
	}

	MODULE
	{
		name = ModuleWeapon
		shortname = #LOC_KPDynamics_Wyrm_weapon
		
		fireTransformName = FireTransform

		hasDeployAnim = false
		hasFireAnimation = false

		maxEffectiveDistance = 5000
		maxTargetingRange = 5000
		maxDeviation = 0.0125

		ammoName = ElectricCharge
		requestResourceAmount = 350

		weaponType = laser
		laserDamage = 1600
		tanAngle = 0.0001 //controls how quickly damage scales down with distance

		isAPS = true
		APSType = missile
		dualModeAPS = true

		projectileColor = 255, 20, 0, 128 //RGBA 0-255
		tracerStartWidth = 0.3
		tracerEndWidth = 0.3

		maxHeat = 3600
		heatPerShot = 40
		heatLoss = 740

		fireSoundPath = BDArmory/Parts/ABL/sounds/laser
		chargeSoundPath = BDArmory/Parts/ABL/sounds/charge
		overheatSoundPath = BDArmory/Parts/ABL/sounds/drain
		oneShotSound = false
		soundRepeatTime = 0
	}

	MODULE
	{
		name = FlagDecal
		textureQuadName = WyrmFlag
	}
}
