PART
{
	// --- general parameters ---
	name = kpaMun
	module = Part
	author = Spartwo
	
	// --- asset parameters ---
	MODEL
	{
		model = KerbalPowers/Armory/Parts/Missiles/Air-To-Air/Mun/Mun
	}
	rescaleFactor = 1


	// --- node definitions ---
	node_attach = 0.0, 0.1725, -0.83, 0, 1, 0, 0
	node_stack_top = 0.0, 0.1725, -0.83, 0, 1, 0, 0

	// --- editor parameters ---
	TechRequired = precisionEngineering
	entryCost = 9000
	cost = 3000
	category = none
	bdacategory = Missiles
	subcategory = 0
	
	attachRules = 1,1,0,0,1 // attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	bulkheadProfiles = srf
	
	title = #LOC_KPDynamics_LRAAM_title
	manufacturer = #LOC_GNC_title
	description = #LOC_KPDynamics_LRAAM_description
	tags = #loc_BDArmory_part_bahaAim120_tag


	// --- standard part parameters ---
	mass = 0.190
	dragModelType = default
	maximum_drag = 0.01
	minimum_drag = 0.01
	angularDrag = 2
	crashTolerance = 5
	maxTemp = 3600

	MODULE
	{
		name = MissileLauncher
		shortName = #LOC_KPDynamics_LRAAM_weapon
		
		thrust = 34 //KN thrust during boost phase
		cruiseThrust = 11 //thrust during cruise phase
		dropTime = 0.1 //how many seconds after release until engine ignites
		boostTime = 2 //seconds of boost phase
		cruiseTime = 470 //seconds of cruise phase
		guidanceActive = true //missile has guidanceActive
		maxTurnRateDPS = 28
		
		DetonateAtMinimumDistance = True

		decoupleSpeed = 10
		decoupleForward = true
		DetonateAtMinimumDistance = true
		
		optimumAirspeed = 770

		aero = true
		liftArea = 0.004
		dragArea = 0.002
		steerMult = 8
		maxTorque = 120
		torqueRampUp = 50
		aeroSteerDamping = 0.1
		gLimit = 45

		missileType = missile		
		homingType = aamLoft
		targetingType = inertial
		inertialDrift = 0.025
		gpsUpdates = 0.5
		// aamLoft
		LoftMaxAltitude = 20000
		LoftRangeOverride = 10000
		LoftAltitudeAdvMax = 15000
		LofMinAltitude = 500
		LoftAngle = 25
		LoftTermAngle = 30
		LoftRangeFac = 0.4
		LoftVertVelComp = 1
		
		maxOffBoresight = 120
		lockedSensorFOV = 6
		minStaticLaunchRange = 100
		maxStaticLaunchRange = 95000
		rotationTransformName = rotationTransform
		radarLOAL = true
		chaffEffectivity = 0.35 		
		seekerTimeout = 80
		
		// terminal guidance
		terminalGuidanceShouldActivate = true
		terminalManeuvering = true
		dumbTerminalGuidance = false
		terminalGuidanceType = radar
		terminalGuidanceDistance = 5800
		activeRadarRange = 15000

		terminalHoming = true
		terminalHomingType = ProNav //switches to ProNav at final engagement for a more accurate homing solution at expense of energy expenditure
		pronavGain = 7 // ProNav gain constant, only used with ProNav and AugProNav homing types (default is 3)
		terminalHomingRange = 9000
		
		deployAnimationName = Deploy
		deployTime = 0.3
		
        exhaustPrefabPath = BDArmory/Models/exhaust/sustainerExhaustPrefab
        boostExhaustPrefabPath = BDArmory/Models/exhaust/smallExhaustPrefabII
		audioClipPath =  BDArmory/Sounds/jet
		boostClipPath = BDArmory/Sounds/rocketLoop
		boostExhaustTransformName = boostTransformAir

		engageAir = true
		engageMissile = false
		engageGround = false
		engageSLW = false
	}

	MODULE
	{
		name = BDExplosivePart
		tntMass = 160
		caliber = 160
		warheadType = ShapedCharge
		//Not Shaped, AOE
	}
}
