		{
				key = 0	0
				key = 10 0	
				key = 15 0
				key = 20 0.325
				key = 40 1.953
				key = 80 3.125
				key = 160 5				
		}
		
		radarLOAL = true 
	}

	MODULE
	{
		name = BDExplosivePart
		tntMass = 80
		warheadType = ShapedCharge
		caliber = 172
	}

	MODULE
	{
