PART
{
	// --- general parameters ---
	name = kpaATACMS
	module = Part
	author = Spartwo

	// --- asset parameters ---
  	//mesh = ATACMS.mu
	MODEL
	{
		model = KerbalPowers/Armory/Parts/Ballistics/ATACMS
	}
	rescaleFactor = 1


	// --- node definitions ---
	node_attach = 0, 0.31, -0.38, 0, 1, 0, 0
	node_stack_top = 0, 0.31, -0.38, 0, 1, 0, 0
