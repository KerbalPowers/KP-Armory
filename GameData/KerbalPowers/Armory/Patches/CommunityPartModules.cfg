=================================================
// *** Replace Jettison with Nodal Attachment Visuals

@PART[kpaNearSight]
{
	// Remove all existing jettison modules
	-MODULE:HAS[#name[ModuleJettison]] {}

	// Add new module
	MODULE
	{
		name = ModuleAttachmentVisuals
		objectDisplayName = Top Cap
		requiredNodes = top //node_stack prefix is ignored in ksp code
		showAttached = TopCap
		//showFree = TopStrutA;TopStrutB //visible transforms when nodes unoccupied
	}
	MODULE
	{
		name = ModuleAttachmentVisuals
		objectDisplayName = Bottom Cap
		requiredNodes = bottom //node_stack prefix is ignored in ksp code
		showAttached = BottomCap 
		//showFree = TopStrutA;TopStrutB //visible transforms when nodes unoccupied
	}
}

@PART[kpaNOTICE]
{
    // Remove all existing jettison modules
    -MODULE:HAS[#name[ModuleJettison]] {}

	// Add new module
	MODULE
	{
		name = ModuleAttachmentVisuals
		objectDisplayName = Top Cap
		requiredNodes = top //node_stack prefix is ignored in ksp code
		showAttached = TopCap;TopStruct1;TopStruct2;TopStruct3
		//showFree = TopStrutA;TopStrutB //visible transforms when nodes unoccupied
	}
	MODULE
	{
		name = ModuleAttachmentVisuals
		objectDisplayName = Bottom Cap
		requiredNodes = bottom //node_stack prefix is ignored in ksp code
		showAttached = BottomCap
		//showFree = TopStrutA;TopStrutB //visible transforms when nodes unoccupied
	}
	MODULE
	{
		name = ModuleAttachmentVisuals
		objectDisplayName = Fairing
		requiredNodes = top;bottom //node_stack prefix is ignored in ksp code
		showAttached = CapBridge
		//showFree = TopStrutA;TopStrutB //visible transforms when nodes unoccupied
	}
}